services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: dgg-frontpage:latest
    restart: unless-stopped
    environment:
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET}
      DECAP_GITHUB_SCOPE: ${DECAP_GITHUB_SCOPE:-public_repo,user}
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    labels:
      - "traefik.http.middlewares.dgg-redirect-non-www.redirectregex.regex=^(http|https)://www\\.(.+)"
      - "traefik.http.middlewares.dgg-redirect-non-www.redirectregex.replacement=$${1}://$${2}"
      - "traefik.http.middlewares.dgg-redirect-non-www.redirectregex.permanent=true"
      - "coolify.traefik.middlewares=dgg-redirect-non-www"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('node:http').get('http://127.0.0.1:3000/', (res) => process.exit(res.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
